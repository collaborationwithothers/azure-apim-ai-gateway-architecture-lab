name: Bicep Plan

on:
  pull_request:
  workflow_dispatch:

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Build Bicep
        run: az bicep build --file infra/bicep/main.bicep
      - name: What-if placeholder
        run: echo "TODO: Add az deployment group what-if after non-secret environment inputs exist."
