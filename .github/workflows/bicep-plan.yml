name: Bicep Plan

on:
  workflow_dispatch:
    inputs:
      expected_repository:
        description: Repository allowed to run this workflow.
        required: true
        default: collaborationwithothers/azure-apim-ai-gateway-architecture-lab
      expected_actor:
        description: GitHub actor allowed to run this workflow.
        required: true
        default: haripraghash

permissions:
  contents: read

jobs:
  bicep:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == inputs.expected_repository &&
      github.actor == inputs.expected_actor &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, cwc-azure-deploy]
    steps:
      - uses: actions/checkout@v4
      - name: Check Azure CLI
        run: |
          az version
          az bicep version
      - name: Build Bicep
        run: az bicep build --file infra/bicep/main.bicep
      - name: What-if placeholder
        run: |
          echo "TODO: Add az deployment group what-if after non-secret environment inputs exist."
