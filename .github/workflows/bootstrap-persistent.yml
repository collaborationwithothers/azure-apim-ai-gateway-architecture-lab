name: Bootstrap Persistent

on:
  workflow_dispatch:
    inputs:
      expected_repository:
        description: Repository allowed to run this workflow.
        required: true
        default: collaborationwithothers/azure-apim-ai-gateway-architecture-lab
      mode:
        description: Bootstrap mode.
        required: true
        type: choice
        default: validate
        options:
          - validate
          - what-if
          - apply
      deployment_location:
        description: Azure deployment metadata location.
        required: true
        default: swedencentral
      deployment_name:
        description: Azure subscription deployment name.
        required: true
        default: apim-ai-gateway-persistent-swc

permissions:
  contents: read

env:
  DEPLOYMENT_LOCATION: ${{ inputs.deployment_location }}
  DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
  TEMPLATE_FILE: infra/bicep/persistent.bicep
  HUB_RESOURCE_GROUP_NAME: rg-cwc-ai-gw-hub-swc-001
  HUB_VNET_NAME: vnet-cwc-ai-gw-hub-swc-001
  APPGW_SUBNET_NAME: snet-appgw
  APIM_SUBNET_NAME: snet-apim
  RUNNER_VNET_RESOURCE_GROUP_NAME: rg-dv-gh-actions-neu
  RUNNER_VNET_NAME: vnet-dv-gh-actions-neu
  RUNNER_SUBNET_NAME: snet-github-actions-private-runner-neu

jobs:
  validate:
    name: Validate Persistent Bicep
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'collaborationwithothers/azure-apim-ai-gateway-architecture-lab' &&
      inputs.expected_repository == 'collaborationwithothers/azure-apim-ai-gateway-architecture-lab' &&
      github.actor == 'haripraghash' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'validate'
    runs-on:
      group: consultwithcloud-azure
      labels: [gh-linux]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Restore Bicep modules
        run: az bicep restore --file "$TEMPLATE_FILE"

      - name: Build Bicep
        run: az bicep build --file "$TEMPLATE_FILE"

      - name: Validate persistent bootstrap contract
        run: bash tests/validate-persistent-bootstrap-test.sh

  what-if:
    name: Azure Persistent What-if
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'collaborationwithothers/azure-apim-ai-gateway-architecture-lab' &&
      inputs.expected_repository == 'collaborationwithothers/azure-apim-ai-gateway-architecture-lab' &&
      github.actor == 'haripraghash' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'what-if'
    runs-on:
      group: consultwithcloud-azure
      labels: [gh-linux]
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      RUNNER_ALLOWED_PUBLIC_IP: ${{ vars.RUNNER_ALLOWED_PUBLIC_IP_CIDR }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate bootstrap inputs
        run: |
          set -euo pipefail
          if [[ "$DEPLOYMENT_LOCATION" == "swedencentral" && "$DEPLOYMENT_NAME" != *-swc ]]; then
            echo "deployment_name must end with -swc when deployment_location is swedencentral." >&2
            exit 1
          fi
          if [[ -z "${RUNNER_ALLOWED_PUBLIC_IP:-}" ]]; then
            echo "Set RUNNER_ALLOWED_PUBLIC_IP_CIDR as a variable on the dev GitHub Environment." >&2
            exit 1
          fi
          if [[ ! "$RUNNER_ALLOWED_PUBLIC_IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$ ]]; then
            echo "RUNNER_ALLOWED_PUBLIC_IP_CIDR must be an IPv4 CIDR value, for example 203.0.113.10/32." >&2
            exit 1
          fi

      - name: Azure login with OIDC
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Check required Azure providers
        run: |
          set -euo pipefail
          missing=0
          for namespace in \
            Microsoft.KeyVault \
            Microsoft.Network
          do
            state="$(az provider show --namespace "$namespace" --query registrationState -o tsv)"
            if [[ "$state" != "Registered" ]]; then
              echo "$namespace is $state. Run apply once to register providers before what-if." >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Infer Key Vault VNet rules
        run: |
          set -euo pipefail
          runner_subnet_id=""
          appgw_subnet_id=""
          apim_subnet_id=""

          if runner_subnet_id="$(az network vnet subnet show \
            --resource-group "$RUNNER_VNET_RESOURCE_GROUP_NAME" \
            --vnet-name "$RUNNER_VNET_NAME" \
            --name "$RUNNER_SUBNET_NAME" \
            --query id \
            -o tsv 2>/dev/null)"; then
            echo "GitHub runner subnet found. Key Vault VNet rules will include $RUNNER_SUBNET_NAME."
          else
            echo "GitHub runner subnet $RUNNER_SUBNET_NAME was not found in $RUNNER_VNET_NAME." >&2
            exit 1
          fi

          if appgw_subnet_id="$(az network vnet subnet show \
            --resource-group "$HUB_RESOURCE_GROUP_NAME" \
            --vnet-name "$HUB_VNET_NAME" \
            --name "$APPGW_SUBNET_NAME" \
            --query id \
            -o tsv 2>/dev/null)"; then
            :
          else
            appgw_subnet_id=""
          fi

          if apim_subnet_id="$(az network vnet subnet show \
            --resource-group "$HUB_RESOURCE_GROUP_NAME" \
            --vnet-name "$HUB_VNET_NAME" \
            --name "$APIM_SUBNET_NAME" \
            --query id \
            -o tsv 2>/dev/null)"; then
            :
          else
            apim_subnet_id=""
          fi

          if [[ -z "$appgw_subnet_id" && -z "$apim_subnet_id" ]]; then
            key_vault_vnet_rule_subnet_ids="$(jq -cn \
              --arg runnerSubnetId "$runner_subnet_id" \
              '[$runnerSubnetId]')"
            echo "Hub subnets not found. Key Vault VNet rules will include only $RUNNER_SUBNET_NAME."
          elif [[ -n "$appgw_subnet_id" && -n "$apim_subnet_id" ]]; then
            key_vault_vnet_rule_subnet_ids="$(jq -cn \
              --arg runnerSubnetId "$runner_subnet_id" \
              --arg appgwSubnetId "$appgw_subnet_id" \
              --arg apimSubnetId "$apim_subnet_id" \
              '[$runnerSubnetId, $appgwSubnetId, $apimSubnetId]')"
            echo "Hub subnets found. Key Vault VNet rules will include $RUNNER_SUBNET_NAME, $APPGW_SUBNET_NAME, and $APIM_SUBNET_NAME."
          else
            echo "Both hub Key Vault client subnets must exist, or neither should exist." >&2
            echo "$APPGW_SUBNET_NAME found: $([[ -n "$appgw_subnet_id" ]] && echo yes || echo no)" >&2
            echo "$APIM_SUBNET_NAME found: $([[ -n "$apim_subnet_id" ]] && echo yes || echo no)" >&2
            exit 1
          fi

          echo "KEY_VAULT_VNET_RULE_SUBNET_IDS=$key_vault_vnet_rule_subnet_ids" >> "$GITHUB_ENV"

      - name: Restore Bicep modules
        run: az bicep restore --file "$TEMPLATE_FILE"

      - name: Build Bicep
        run: az bicep build --file "$TEMPLATE_FILE"

      - name: Run subscription what-if
        run: |
          set -euo pipefail
          az deployment sub what-if \
            --name "$DEPLOYMENT_NAME" \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file "$TEMPLATE_FILE" \
            --parameters runnerAllowedPublicIp="$RUNNER_ALLOWED_PUBLIC_IP" \
              keyVaultVirtualNetworkRuleSubnetIds="$KEY_VAULT_VNET_RULE_SUBNET_IDS"

  apply:
    name: Azure Persistent Apply
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'collaborationwithothers/azure-apim-ai-gateway-architecture-lab' &&
      inputs.expected_repository == 'collaborationwithothers/azure-apim-ai-gateway-architecture-lab' &&
      github.actor == 'haripraghash' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'apply'
    runs-on:
      group: consultwithcloud-azure
      labels: [gh-linux]
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      RUNNER_ALLOWED_PUBLIC_IP: ${{ vars.RUNNER_ALLOWED_PUBLIC_IP_CIDR }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate bootstrap inputs
        run: |
          set -euo pipefail
          if [[ "$DEPLOYMENT_LOCATION" == "swedencentral" && "$DEPLOYMENT_NAME" != *-swc ]]; then
            echo "deployment_name must end with -swc when deployment_location is swedencentral." >&2
            exit 1
          fi
          if [[ -z "${RUNNER_ALLOWED_PUBLIC_IP:-}" ]]; then
            echo "Set RUNNER_ALLOWED_PUBLIC_IP_CIDR as a variable on the dev GitHub Environment." >&2
            exit 1
          fi
          if [[ ! "$RUNNER_ALLOWED_PUBLIC_IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$ ]]; then
            echo "RUNNER_ALLOWED_PUBLIC_IP_CIDR must be an IPv4 CIDR value, for example 203.0.113.10/32." >&2
            exit 1
          fi

      - name: Azure login with OIDC
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Register required Azure providers
        run: |
          set -euo pipefail
          for namespace in \
            Microsoft.KeyVault \
            Microsoft.Network
          do
            az provider register --namespace "$namespace" --wait
          done

      - name: Infer Key Vault VNet rules
        run: |
          set -euo pipefail
          runner_subnet_id=""
          appgw_subnet_id=""
          apim_subnet_id=""

          if runner_subnet_id="$(az network vnet subnet show \
            --resource-group "$RUNNER_VNET_RESOURCE_GROUP_NAME" \
            --vnet-name "$RUNNER_VNET_NAME" \
            --name "$RUNNER_SUBNET_NAME" \
            --query id \
            -o tsv 2>/dev/null)"; then
            echo "GitHub runner subnet found. Key Vault VNet rules will include $RUNNER_SUBNET_NAME."
          else
            echo "GitHub runner subnet $RUNNER_SUBNET_NAME was not found in $RUNNER_VNET_NAME." >&2
            exit 1
          fi

          if appgw_subnet_id="$(az network vnet subnet show \
            --resource-group "$HUB_RESOURCE_GROUP_NAME" \
            --vnet-name "$HUB_VNET_NAME" \
            --name "$APPGW_SUBNET_NAME" \
            --query id \
            -o tsv 2>/dev/null)"; then
            :
          else
            appgw_subnet_id=""
          fi

          if apim_subnet_id="$(az network vnet subnet show \
            --resource-group "$HUB_RESOURCE_GROUP_NAME" \
            --vnet-name "$HUB_VNET_NAME" \
            --name "$APIM_SUBNET_NAME" \
            --query id \
            -o tsv 2>/dev/null)"; then
            :
          else
            apim_subnet_id=""
          fi

          if [[ -z "$appgw_subnet_id" && -z "$apim_subnet_id" ]]; then
            key_vault_vnet_rule_subnet_ids="$(jq -cn \
              --arg runnerSubnetId "$runner_subnet_id" \
              '[$runnerSubnetId]')"
            echo "Hub subnets not found. Key Vault VNet rules will include only $RUNNER_SUBNET_NAME."
          elif [[ -n "$appgw_subnet_id" && -n "$apim_subnet_id" ]]; then
            key_vault_vnet_rule_subnet_ids="$(jq -cn \
              --arg runnerSubnetId "$runner_subnet_id" \
              --arg appgwSubnetId "$appgw_subnet_id" \
              --arg apimSubnetId "$apim_subnet_id" \
              '[$runnerSubnetId, $appgwSubnetId, $apimSubnetId]')"
            echo "Hub subnets found. Key Vault VNet rules will include $RUNNER_SUBNET_NAME, $APPGW_SUBNET_NAME, and $APIM_SUBNET_NAME."
          else
            echo "Both hub Key Vault client subnets must exist, or neither should exist." >&2
            echo "$APPGW_SUBNET_NAME found: $([[ -n "$appgw_subnet_id" ]] && echo yes || echo no)" >&2
            echo "$APIM_SUBNET_NAME found: $([[ -n "$apim_subnet_id" ]] && echo yes || echo no)" >&2
            exit 1
          fi

          echo "KEY_VAULT_VNET_RULE_SUBNET_IDS=$key_vault_vnet_rule_subnet_ids" >> "$GITHUB_ENV"

      - name: Restore Bicep modules
        run: az bicep restore --file "$TEMPLATE_FILE"

      - name: Build Bicep
        run: az bicep build --file "$TEMPLATE_FILE"

      - name: Run subscription deployment
        run: |
          set -euo pipefail
          az deployment sub create \
            --name "$DEPLOYMENT_NAME" \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file "$TEMPLATE_FILE" \
            --parameters runnerAllowedPublicIp="$RUNNER_ALLOWED_PUBLIC_IP" \
              keyVaultVirtualNetworkRuleSubnetIds="$KEY_VAULT_VNET_RULE_SUBNET_IDS"
