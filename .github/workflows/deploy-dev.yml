name: Deploy Dev

on:
  workflow_dispatch:
    inputs:
      expected_repository:
        description: Repository allowed to run this workflow.
        required: true
        default: collaborationwithothers/azure-apim-ai-gateway-architecture-lab
      expected_actor:
        description: GitHub actor allowed to run this workflow.
        required: true
        default: haripraghash

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == inputs.expected_repository &&
      github.actor == inputs.expected_actor &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, cwc-azure-deploy]
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Deployment intentionally disabled
        run: |
          echo "TODO: Add Azure login and deployment only after dev inputs, approvals, and rollback steps are documented."
          echo "This first-pass workflow does not deploy resources."
