name: Infra Deploy

on:
  workflow_dispatch:
    inputs:
      expected_repository:
        description: Repository allowed to run this workflow.
        required: true
        default: collaborationwithothers/azure-apim-ai-gateway-architecture-lab
      mode:
        description: Deployment mode.
        required: true
        type: choice
        default: validate
        options:
          - validate
          - what-if
          - apply
      deployment_location:
        description: Azure deployment metadata location.
        required: true
        default: swedencentral
      template_file:
        description: Repository-relative Bicep template path.
        required: true
        default: infra/bicep/main.bicep
      parameters_file:
        description: Optional repository-relative Bicep parameters file.
        required: false
        default: ""
      enable_public_edge:
        description: Deploy Application Gateway and public DNS alias after the certificate exists.
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      deployment_name:
        description: Azure subscription deployment name.
        required: true
        default: apim-ai-gateway-lab-swc

permissions:
  contents: read

env:
  DEPLOYMENT_LOCATION: ${{ inputs.deployment_location }}
  TEMPLATE_FILE: ${{ inputs.template_file }}
  PARAMETERS_FILE: ${{ inputs.parameters_file }}
  ENABLE_PUBLIC_EDGE: ${{ inputs.enable_public_edge }}
  DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
  SHARED_KEY_VAULT_NAME: kv-cwc-aigw-shr-swc-001
  LAB_CERTIFICATE_NAME: cert-lab-consultwithcloud-com
  APIM_RESOURCE_GROUP: rg-cwc-ai-gw-hub-swc-001
  APIM_SERVICE_NAME: apim-cwc-ai-gw-swc-001
  APIM_PRIVATE_DNS_ZONE_NAME: apim-cwc-ai-gw-swc-001.azure-api.net
  APIM_PRIVATE_DNS_RECORD_NAME: "@"

jobs:
  validate:
    name: Validate Bicep
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'collaborationwithothers/azure-apim-ai-gateway-architecture-lab' &&
      inputs.expected_repository == 'collaborationwithothers/azure-apim-ai-gateway-architecture-lab' &&
      github.actor == 'haripraghash' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'validate'
    runs-on:
      group: consultwithcloud-azure
      labels: [gh-linux]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Restore Bicep modules
        run: az bicep restore --file "$TEMPLATE_FILE"

      - name: Validate APIM diagnostic configuration
        run: bash tests/validate-apim-diagnostic-test.sh

      - name: Validate subscription-scope resource IDs
        run: bash tests/validate-subscription-scope-resource-ids-test.sh

      - name: Validate lab public DNS zone
        run: bash tests/validate-lab-public-dns-zone-test.sh

      - name: Validate spoke output contract
        run: bash tests/validate-spoke-output-contract-test.sh

      - name: Build Bicep
        run: az bicep build --file "$TEMPLATE_FILE"

  what-if:
    name: Azure What-if
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'collaborationwithothers/azure-apim-ai-gateway-architecture-lab' &&
      inputs.expected_repository == 'collaborationwithothers/azure-apim-ai-gateway-architecture-lab' &&
      github.actor == 'haripraghash' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'what-if'
    runs-on:
      group: consultwithcloud-azure
      labels: [gh-linux]
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      RUNNER_ALLOWED_PUBLIC_IP: ${{ vars.RUNNER_ALLOWED_PUBLIC_IP_CIDR }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate deployment stage inputs
        run: |
          set -euo pipefail
          if [[ "$DEPLOYMENT_LOCATION" == "swedencentral" && "$DEPLOYMENT_NAME" != *-swc ]]; then
            echo "deployment_name must end with -swc when deployment_location is swedencentral." >&2
            exit 1
          fi
          if [[ -z "${RUNNER_ALLOWED_PUBLIC_IP:-}" ]]; then
            echo "Set RUNNER_ALLOWED_PUBLIC_IP_CIDR as a variable on the dev GitHub Environment." >&2
            exit 1
          fi
          if [[ ! "$RUNNER_ALLOWED_PUBLIC_IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$ ]]; then
            echo "RUNNER_ALLOWED_PUBLIC_IP_CIDR must be an IPv4 CIDR value, for example 203.0.113.10/32." >&2
            exit 1
          fi

      - name: Azure login with OIDC
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Check required Azure providers
        run: |
          set -euo pipefail
          missing=0
          for namespace in \
            Microsoft.Network \
            Microsoft.ApiManagement \
            Microsoft.ContainerRegistry \
            Microsoft.KeyVault \
            Microsoft.Insights \
            Microsoft.OperationalInsights \
            Microsoft.Web
          do
            state="$(az provider show --namespace "$namespace" --query registrationState -o tsv)"
            if [[ "$state" != "Registered" ]]; then
              echo "$namespace is $state. Run apply once to register providers before what-if." >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Infer custom domain certificate secret URI
        run: |
          set -euo pipefail
          if [[ "$ENABLE_PUBLIC_EDGE" != "true" ]]; then
            echo "CUSTOM_DOMAIN_CERTIFICATE_SECRET_URI=" >> "$GITHUB_ENV"
            echo "Public edge disabled. Certificate secret URI will remain empty."
            exit 0
          fi

          if ! certificate_secret_id="$(az keyvault certificate show \
            --vault-name "$SHARED_KEY_VAULT_NAME" \
            --name "$LAB_CERTIFICATE_NAME" \
            --query sid \
            -o tsv 2>/dev/null)"; then
            echo "enable_public_edge=true requires certificate cert-lab-consultwithcloud-com in Key Vault kv-cwc-aigw-shr-swc-001." >&2
            echo "Run the certificate workflow before enabling the public edge." >&2
            exit 1
          fi

          if [[ -z "$certificate_secret_id" || "$certificate_secret_id" != */secrets/*/* ]]; then
            echo "Key Vault certificate $LAB_CERTIFICATE_NAME did not return a valid versioned secret URI." >&2
            exit 1
          fi

          versionless_secret_id="${certificate_secret_id%/*}"
          echo "CUSTOM_DOMAIN_CERTIFICATE_SECRET_URI=$versionless_secret_id" >> "$GITHUB_ENV"
          echo "Using versionless Key Vault secret URI for $LAB_CERTIFICATE_NAME."

      - name: Restore Bicep modules
        run: az bicep restore --file "$TEMPLATE_FILE"

      - name: Validate APIM diagnostic configuration
        run: bash tests/validate-apim-diagnostic-test.sh

      - name: Validate subscription-scope resource IDs
        run: bash tests/validate-subscription-scope-resource-ids-test.sh

      - name: Validate lab public DNS zone
        run: bash tests/validate-lab-public-dns-zone-test.sh

      - name: Validate spoke output contract
        run: bash tests/validate-spoke-output-contract-test.sh

      - name: Build Bicep
        run: az bicep build --file "$TEMPLATE_FILE"

      - name: Run subscription what-if
        run: |
          set -euo pipefail
          args=(
            --name "$DEPLOYMENT_NAME"
            --location "$DEPLOYMENT_LOCATION"
            --template-file "$TEMPLATE_FILE"
            --parameters
            runnerAllowedPublicIp="$RUNNER_ALLOWED_PUBLIC_IP"
            enablePublicEdge="$ENABLE_PUBLIC_EDGE"
          )
          if [[ -n "$PARAMETERS_FILE" ]]; then
            args+=(--parameters "@$PARAMETERS_FILE")
          fi
          args+=(--parameters customDomainCertificateSecretUri="$CUSTOM_DOMAIN_CERTIFICATE_SECRET_URI")
          az deployment sub what-if "${args[@]}"

  apply:
    name: Azure Apply
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'collaborationwithothers/azure-apim-ai-gateway-architecture-lab' &&
      inputs.expected_repository == 'collaborationwithothers/azure-apim-ai-gateway-architecture-lab' &&
      github.actor == 'haripraghash' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'apply'
    runs-on:
      group: consultwithcloud-azure
      labels: [gh-linux]
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      RUNNER_ALLOWED_PUBLIC_IP: ${{ vars.RUNNER_ALLOWED_PUBLIC_IP_CIDR }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate deployment stage inputs
        run: |
          set -euo pipefail
          if [[ "$DEPLOYMENT_LOCATION" == "swedencentral" && "$DEPLOYMENT_NAME" != *-swc ]]; then
            echo "deployment_name must end with -swc when deployment_location is swedencentral." >&2
            exit 1
          fi
          if [[ -z "${RUNNER_ALLOWED_PUBLIC_IP:-}" ]]; then
            echo "Set RUNNER_ALLOWED_PUBLIC_IP_CIDR as a variable on the dev GitHub Environment." >&2
            exit 1
          fi
          if [[ ! "$RUNNER_ALLOWED_PUBLIC_IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$ ]]; then
            echo "RUNNER_ALLOWED_PUBLIC_IP_CIDR must be an IPv4 CIDR value, for example 203.0.113.10/32." >&2
            exit 1
          fi

      - name: Azure login with OIDC
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Register required Azure providers
        run: |
          set -euo pipefail
          for namespace in \
            Microsoft.Network \
            Microsoft.ApiManagement \
            Microsoft.ContainerRegistry \
            Microsoft.KeyVault \
            Microsoft.Insights \
            Microsoft.OperationalInsights \
            Microsoft.Web
          do
            az provider register --namespace "$namespace" --wait
          done

      - name: Infer custom domain certificate secret URI
        run: |
          set -euo pipefail
          if [[ "$ENABLE_PUBLIC_EDGE" != "true" ]]; then
            echo "CUSTOM_DOMAIN_CERTIFICATE_SECRET_URI=" >> "$GITHUB_ENV"
            echo "Public edge disabled. Certificate secret URI will remain empty."
            exit 0
          fi

          if ! certificate_secret_id="$(az keyvault certificate show \
            --vault-name "$SHARED_KEY_VAULT_NAME" \
            --name "$LAB_CERTIFICATE_NAME" \
            --query sid \
            -o tsv 2>/dev/null)"; then
            echo "enable_public_edge=true requires certificate cert-lab-consultwithcloud-com in Key Vault kv-cwc-aigw-shr-swc-001." >&2
            echo "Run the certificate workflow before enabling the public edge." >&2
            exit 1
          fi

          if [[ -z "$certificate_secret_id" || "$certificate_secret_id" != */secrets/*/* ]]; then
            echo "Key Vault certificate $LAB_CERTIFICATE_NAME did not return a valid versioned secret URI." >&2
            exit 1
          fi

          versionless_secret_id="${certificate_secret_id%/*}"
          echo "CUSTOM_DOMAIN_CERTIFICATE_SECRET_URI=$versionless_secret_id" >> "$GITHUB_ENV"
          echo "Using versionless Key Vault secret URI for $LAB_CERTIFICATE_NAME."

      - name: Restore Bicep modules
        run: az bicep restore --file "$TEMPLATE_FILE"

      - name: Validate APIM diagnostic configuration
        run: bash tests/validate-apim-diagnostic-test.sh

      - name: Validate subscription-scope resource IDs
        run: bash tests/validate-subscription-scope-resource-ids-test.sh

      - name: Validate lab public DNS zone
        run: bash tests/validate-lab-public-dns-zone-test.sh

      - name: Validate spoke output contract
        run: bash tests/validate-spoke-output-contract-test.sh

      - name: Build Bicep
        run: az bicep build --file "$TEMPLATE_FILE"

      - name: Run subscription deployment
        run: |
          set -euo pipefail
          args=(
            --name "$DEPLOYMENT_NAME"
            --location "$DEPLOYMENT_LOCATION"
            --template-file "$TEMPLATE_FILE"
            --parameters
            runnerAllowedPublicIp="$RUNNER_ALLOWED_PUBLIC_IP"
            enablePublicEdge="$ENABLE_PUBLIC_EDGE"
          )
          if [[ -n "$PARAMETERS_FILE" ]]; then
            args+=(--parameters "@$PARAMETERS_FILE")
          fi
          args+=(--parameters customDomainCertificateSecretUri="$CUSTOM_DOMAIN_CERTIFICATE_SECRET_URI")
          az deployment sub create "${args[@]}"

      - name: Upsert APIM private gateway DNS record
        run: |
          set -euo pipefail
          apim_private_ip=""

          for attempt in {1..30}; do
            apim_private_ip="$(az resource show \
              --resource-group "$APIM_RESOURCE_GROUP" \
              --resource-type Microsoft.ApiManagement/service \
              --name "$APIM_SERVICE_NAME" \
              --api-version 2024-05-01 \
              --query "properties.privateIPAddresses[0]" \
              -o tsv)"

            if [[ -n "$apim_private_ip" && "$apim_private_ip" != "None" ]]; then
              break
            fi

            echo "APIM private IP address is not available yet. Waiting before retry $attempt of 30."
            sleep 20
          done

          if [[ -z "$apim_private_ip" || "$apim_private_ip" == "None" ]]; then
            echo "APIM private IP address is not available after waiting. Rerun apply after APIM provisioning completes." >&2
            exit 1
          fi

          if [[ ! "$apim_private_ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "APIM returned an invalid private IP address: $apim_private_ip" >&2
            exit 1
          fi

          if ! az network private-dns record-set a show \
            --resource-group "$APIM_RESOURCE_GROUP" \
            --zone-name "$APIM_PRIVATE_DNS_ZONE_NAME" \
            --name "$APIM_PRIVATE_DNS_RECORD_NAME" \
            --query name \
            -o tsv >/dev/null 2>&1; then
            az network private-dns record-set a create \
              --resource-group "$APIM_RESOURCE_GROUP" \
              --zone-name "$APIM_PRIVATE_DNS_ZONE_NAME" \
              --name "$APIM_PRIVATE_DNS_RECORD_NAME" \
              --ttl 300 \
              --only-show-errors \
              -o none
          fi

          az network private-dns record-set a update \
            --resource-group "$APIM_RESOURCE_GROUP" \
            --zone-name "$APIM_PRIVATE_DNS_ZONE_NAME" \
            --name "$APIM_PRIVATE_DNS_RECORD_NAME" \
            --set "ttl=300" "aRecords=[{\"ipv4Address\":\"$apim_private_ip\"}]" \
            --only-show-errors \
            -o none

          echo "Mapped $APIM_PRIVATE_DNS_ZONE_NAME to $apim_private_ip."
