name: Validate Markdown

on:
  workflow_dispatch:
    inputs:
      expected_repository:
        description: Repository allowed to run this workflow.
        required: true
        default: collaborationwithothers/azure-apim-ai-gateway-architecture-lab
      expected_actor:
        description: GitHub actor allowed to run this workflow.
        required: true
        default: haripraghash

permissions:
  contents: read

jobs:
  markdown:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == inputs.expected_repository &&
      github.actor == inputs.expected_actor &&
      github.ref == 'refs/heads/main'
    runs-on:
      group: consultwithcloud-azure
      labels: [gh-linux]
    steps:
      - uses: actions/checkout@v4
      - name: Check whitespace
        run: git diff --check
      - name: Lint Markdown
        run: markdownlint "**/*.md"
